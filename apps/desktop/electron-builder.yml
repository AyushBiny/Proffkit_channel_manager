appId: com.proffkit.reception
productName: Proffkit Reception Desk
directories:
  buildResources: build
  output: dist
files:
  - "!**/.vscode/*"
  - "!src/*"
  - "!electron.vite.config.{js,ts,mjs,cjs}"
electronLanguages:
  - en-US
compression: maximum
win:
  target:
    - target: nsis
      arch:
        - x64
mac:
  target:
    - dmg
